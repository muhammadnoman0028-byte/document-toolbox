<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Docx.Hub - convert and compress your documents and images." />
    <meta name="theme-color" content="#e6ebf2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Docx.Hub" />
    <title>Docx.Hub | Login</title>
    <link rel="icon" href="./public/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./public/icons/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <div id="splash-screen" class="splash-screen" aria-label="Loading Docx.Hub">
      <div class="splash-content neo-raised">
        <div class="splash-logo neo-inset" aria-hidden="true">DH</div>
        <h1 class="splash-title">Docx.Hub</h1>
        <p class="splash-tagline">Convert & compress documents with ease</p>
        <div class="splash-loader neo-inset" aria-hidden="true"><span></span></div>
      </div>
    </div>

    <main id="auth-view" class="view hidden" aria-label="Login">
      <section class="login-card neo-raised">
        <div class="login-brand">
          <div class="brand-mark neo-raised-sm" aria-hidden="true">DH</div>
          <h2>Welcome Back</h2>
          <p>Sign in to access your conversion tools</p>
        </div>

        <form id="login-form" class="login-form" novalidate>
          <label class="field">
            <span>Email</span>
            <div class="input-wrap neo-inset">
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </label>

          <label class="field">
            <span>Password</span>
            <div class="input-wrap neo-inset">
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required minlength="4" />
            </div>
          </label>

          <div class="form-row">
            <label class="check">
              <input type="checkbox" id="remember" name="remember" />
              <span class="check-ui neo-inset-sm" aria-hidden="true"></span>
              <span>Remember me</span>
            </label>
            <a href="#" class="link-muted" id="forgot-link">Forgot password?</a>
          </div>

          <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn-primary neo-raised-sm">Login</button>
        </form>

        <p class="signup-hint">New here? <a href="#" id="demo-fill">Use demo account</a></p>
      </section>
    </main>

    <script src="./src/scripts/main.js" data-page="login" data-home="./src/pages/home.html" data-sw="./sw.js" data-sw-scope="./"></script>
  </body>
</html>
